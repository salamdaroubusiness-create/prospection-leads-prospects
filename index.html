<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSC Business Center · Prospection et diagnostic</title><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap"><style>:root{--bg:#F7F6FB;--surface:#fff;--ink:#1C1842;--muted:#5B5878;--line:#DEDCEC;--brand:#29235C;--brand-ink:#fff;--accent:#E6007E;--wash:#EEECF8;--ok:#1B7A4B;--warn:#B26A00;--danger:#B3261E;--f:"Public Sans","Segoe UI",system-ui,sans-serif;--fd:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f)}
h1,h2,h3{font-family:var(--fd);line-height:1.2;margin:0 0 10px}
h1{font-size:1.7rem}h2{font-size:1.25rem}h3{font-size:1.02rem}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
.sr{position:absolute;left:-9999px}
/* layout */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--brand);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.side img{width:150px;margin:2px 6px 14px}
.side nav{display:grid;gap:4px}
.side a.nv{display:flex;justify-content:space-between;align-items:center;color:#d9d6f5;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:500}
.side a.nv:hover{background:rgba(255,255,255,.08)}
.side a.nv[aria-current=page]{background:var(--accent);color:#fff}
.side .cnt{background:rgba(255,255,255,.18);border-radius:99px;font-size:12px;padding:1px 8px}
.side .foot{margin-top:auto;font-size:12px;color:#aaa6d8;padding:6px}
main{padding:24px clamp(14px,3vw,36px) 60px;min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side img{width:110px;margin:0 8px 0 0}.side nav{display:flex;flex-wrap:wrap}.side .foot{display:none}}
/* ui */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(.93)}
.btn.line{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.dark{background:var(--brand)}
.btn.ok{background:#1b9f5c}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:14px}
.kpi b{display:block;font:800 1.7rem var(--fd)}
.kpi span{color:var(--muted);font-size:13px}
.kpi.warn{border-top-color:var(--warn)}.kpi.bad{border-top-color:var(--danger)}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fld{margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--wash);color:var(--brand);white-space:nowrap}
.st-0{background:#e9e7fb}.st-1{background:#fde7f3;color:#a40058}.st-2{background:#fff0d6;color:#8a5200}.st-3{background:#dff0ff;color:#0b5aa6}.st-4{background:#ffe3df;color:#a3281b}.st-5{background:#dcf5e7;color:#14693f}.st-6{background:#e8e8ee;color:#555}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th,.tb td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tb th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tb tr.clk{cursor:pointer}.tb tr.clk:hover{background:var(--wash)}
.tbw{overflow-x:auto}
.late{color:var(--danger);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a[aria-current=page]{color:var(--brand);border-bottom-color:var(--accent)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:13.5px}
.bar i{display:block;height:14px;background:var(--wash);border-radius:7px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--accent);border-radius:7px}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--wash);border-radius:12px;padding:10px;min-height:140px}
.col h3{display:flex;justify-content:space-between;font-size:.9rem}
.col.over{outline:2px dashed var(--accent)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:13.5px}
.kc b{display:block}
.kc .m{color:var(--muted);font-size:12.5px}
/* diagnostic */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{position:relative;margin:0;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;background:#fff;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}
.seg input:checked+span{display:block}
.seg label:has(input:checked){background:var(--brand);color:#fff}
.seg label.l0:has(input:checked){background:#b3261e}.seg label.l1:has(input:checked){background:#b26a00}.seg label.l2:has(input:checked){background:#1b7a4b}
.need{display:grid;grid-template-columns:200px auto 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:760px){.need{grid-template-columns:1fr}}
.reco{border:2px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.reco.top{border-color:var(--accent)}
/* devis builder */
.qgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.qgrid{grid-template-columns:1fr}}
.qopt{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;background:#fff;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:400;margin-bottom:6px}
.qopt:has(input:checked){border-color:var(--accent);background:var(--wash)}
.qopt input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.qopt .n{flex:1}.qopt .p{font-weight:800;white-space:nowrap}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font:700 12px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 0 6px}
.sum{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px}
.sum .l{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.sum .l.big{font-size:1.2rem;font-weight:800;color:var(--accent);border:0}
ul.gl,ol.gl{margin:6px 0 12px;padding-left:20px}ul.gl li,ol.gl li{margin-bottom:5px}
.sheet h3{margin:16px 0 6px;color:var(--brand)}.sheet .qa{margin-bottom:8px;break-inside:avoid}.sheet .ans{min-height:30px;border-bottom:1px dotted #888;padding:2px 0;font-size:13px;white-space:pre-wrap}
/* rapport */
.rp-top{display:flex;gap:18px;align-items:center;background:#F7F6FB;border-radius:10px;padding:12px 16px;margin:10px 0}
.rp-score{min-width:150px;text-align:center}.rp-score b{display:block;font:800 2.4rem var(--fd);color:var(--accent);line-height:1}.rp-score small{font-size:1rem;color:#555}.rp-score span{display:block;font-size:12px;color:#555}.rp-score em{display:inline-block;margin-top:4px;background:var(--brand);color:#fff;border-radius:99px;padding:2px 12px;font-style:normal;font-size:12px;font-weight:700}
.rpb{margin:6px 0 10px}.rpr{display:grid;grid-template-columns:200px 1fr 80px;gap:10px;align-items:center;margin:6px 0;font-size:13.5px}.rpr i{display:block;height:14px;background:#E8E6F4;border-radius:7px;overflow:hidden}.rpr i b{display:block;height:100%}.rpr em{font-style:normal;font-weight:700;font-size:12.5px}
.rpk{border-left:5px solid var(--accent);background:#FAFAFD;padding:8px 14px;margin:10px 0;border-radius:0 8px 8px 0;break-inside:avoid}.rpk p{margin:5px 0}
.rp h3{margin-top:18px}@media(max-width:700px){.rpr{grid-template-columns:1fr}}
.rp2-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.rp2-chips div{border:1px solid #E1DFF0;border-radius:8px;padding:6px 10px;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}.rp2-chips em{font-style:normal;font-weight:700}
.rp2-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;break-inside:avoid}.rp2-ok{list-style:none;padding:0;margin:6px 0}.rp2-ok li{padding:3px 0 3px 22px;position:relative}.rp2-ok li:before{content:'\2714';position:absolute;left:0;color:#1B7A4B;font-weight:700}
.rp2-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rp2-steps div{background:#F7F6FB;border-radius:8px;padding:8px 10px;font-size:12.5px;break-inside:avoid}.rp2-steps b{display:block;color:var(--accent)}
.rp2-plat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.rp2-plat div{border:1px solid #E1DFF0;border-radius:8px;padding:8px 10px;font-size:13px;break-inside:avoid}
@media(max-width:700px){.rp2-chips,.rp2-two,.rp2-steps{grid-template-columns:1fr}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* modal / sheet */
.modal{position:fixed;inset:0;background:rgba(20,16,50,.6);z-index:50;overflow:auto;padding:20px}
.modal .box{background:#fff;max-width:860px;margin:0 auto;border-radius:12px;padding:20px}
.modal .bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sheet{font-size:14px;color:#111}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:16px}
.sheet header img{width:150px}
.sheet h2{font-size:1.5rem;color:var(--brand)}
.sheet table{width:100%;border-collapse:collapse;margin:12px 0}
.sheet th{background:var(--brand);color:#fff;text-align:left;padding:8px;font-size:12px}
.sheet td{padding:8px;border-bottom:1px solid #ddd}
.sheet .r{text-align:right;white-space:nowrap}
.sheet .tot td{font-weight:800;font-size:1.05rem;border-top:2px solid var(--brand)}
.sheet .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
.sheet .sig div{border-top:1px solid #333;padding-top:6px;font-size:12px;height:90px}
.sheet .fine{font-size:12px;color:#555;margin-top:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.empty{text-align:center;padding:30px;color:var(--muted)}
.hist li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist{list-style:none;margin:0;padding:0}
@media print{
  body{background:#fff}
  .app,.noprint,.toast{display:none!important}
  .modal{position:static;background:none;padding:0;overflow:visible}
  .modal .box{max-width:none;padding:0;box-shadow:none;margin:0}
  .sheet .sig{page-break-inside:avoid}
  @page{margin:14mm}
}

function diagScore(dg){
  if(!dg)return null;
  var tot=0,n=0;NEEDS.forEach(function(x){var v=dg.needs&&dg.needs[x[0]];if(v!=null&&v!==''){tot+=parseInt(v,10)*50;n++;}});
  if(!n)return null;
  var s=Math.round(tot/n),lab=s<25?'Démarrage':s<50?'Structuration':s<75?'Développement':'Accélération';
  return {score:s,label:lab};
}
function recommend(dg,stade){
  var miss={};NEEDS.forEach(function(x){var v=dg&&dg.needs?dg.needs[x[0]]:null;miss[x[0]]=v==null||v===''?0:(v==0?2:v==1?1:0);});
  var out=CATALOG.map(function(p){
    var g=0,cov=[];p.needs.forEach(function(n){if(miss[n]>0){g+=miss[n];cov.push(n);}});
    var bonus=0;
    if(stade===STADES[0]&&p.id===1)bonus=2;
    if(stade===STADES[1]&&(p.id===1||p.id===4))bonus=1;
    if(stade===STADES[2]&&(p.id===6||p.id===2||p.id===4))bonus=1;
    if(stade===STADES[3]&&(p.id===7||p.id===8||p.id===9))bonus=1;
    var pr=cat(p.id).price;
    return {p:cat(p.id),g:g,cov:cov,score:g+bonus-(pr||250000)/600000,price:pr};
  }).filter(function(r){return r.g>0;});
  out.sort(function(a,b){return b.score-a.score;});

/* ---------- diagnostic ---------- */
function readDiag(f){
  var dg={needs:{},notes:{},date:today()};
  NEEDS.forEach(function(x){
    var r=f.querySelector('input[name="n_'+x[0]+'"]:checked');dg.needs[x[0]]=r?r.value:'';
    var c=f.elements['c_'+x[0]];dg.notes[x[0]]=c?c.value.trim():'';
  });
  ['idee','cible','objectif','budget','resume'].forEach(function(k){dg[k]=f.elements[k]?f.elements[k].value.trim():'';});
  dg.stade=f.elements.stade?f.elements.stade.value:'';
  return dg;
}
function diagResult(dg){
  var sc=diagScore(dg);
  if(!sc)return '<p class="empty">Évaluez au moins un besoin pour voir le résultat et les projets recommandés.</p>';
  var rec=recommend(dg,dg.stade);
  return '<div class="kpis" style="margin-bottom:10px"><div class="kpi"><b>'+sc.score+' / 100</b><span>maturité de l’entreprise</span></div><div class="kpi"><b style="font-size:1.2rem">'+sc.label+'</b><span>niveau</span></div></div>'+
   bars(NEEDS.map(function(x){var v=dg.needs[x[0]];return [x[1],v===''||v==null?0:parseInt(v,10)*50];}),100)+
   '<h3 style="margin-top:16px">Projets recommandés</h3>'+(rec.length?'<div class="grid g3">'+rec.map(function(r,i){
     return '<div class="reco'+(i===0?' top':'')+'">'+(i===0?'<span class="tag st-1">Meilleur choix</span> ':'')+'<h3>'+r.p.id+'. '+esc(r.p.name)+'</h3><p class="small muted">'+esc(r.p['for'])+'</p><p class="small">Comble : '+r.cov.map(function(n){return NEEDS.filter(function(x){return x[0]===n;})[0][1];}).join(', ')+'</p><b>'+pTxt(r.p,r.price)+'</b> <span class="muted small">· '+esc(r.p.dur)+'</span></div>';

   fams.map(function(f){return '<fieldset><legend>'+esc(f)+'</legend>'+CATALOG.filter(function(c){return c.family===f;}).map(function(c){var pr=cat(c.id);return '<label class="qopt"><input type="checkbox" name="proj" value="'+c.id+'"'+(DV.sel.indexOf(c.id)>-1?' checked':'')+'><span class="n">'+c.id+'. '+esc(c.name)+(recIds.indexOf(c.id)>-1?' <span class="tag st-1">Recommandé</span>':'')+'<br><span class="small muted">'+esc(pr.dur)+(pr.suivi>0?' · suivi '+pr.suivi+' mois':'')+'</span></span><span class="p">'+pTxt(c,pr.price)+'</span></label>';}).join('')+'</fieldset>';}).join('')+
   '<h3>2. Paiement et remises</h3><fieldset><legend>Mode de paiement</legend><label class="qopt"><input type="radio" name="pay" value="tranches" checked><span class="n">En 3 tranches (40 % / 30 % / 30 %)</span></label><label class="qopt"><input type="radio" name="pay" value="comptant"><span class="n">Comptant (100 % à la signature)<br><span class="small muted">5 % de remise</span></span></label></fieldset><fieldset><legend>Autres remises (5 % chacune)</legend>'+OPTS.slice(1).map(function(x){return '<label class="qopt"><input type="checkbox" data-o="'+x[0]+'"><span class="n">'+x[1]+'</span></label>';}).join('')+'<p class="small muted">10 % de remise automatique pour deux projets ou plus commandés ensemble.</p></fieldset><fieldset><legend>Option</legend><label class="qopt"><input type="checkbox" data-o="renf"><span class="n">Formule renforcée (suivi plus serré, délai plus court ou options)<br><span class="small muted">+ 25 %</span></span></label></fieldset></div>'+

function dvRead(){
  var f=$('#dvform');if(!f)return;
  DV.sel=$$('input[name="proj"]:checked',f).map(function(x){return parseInt(x.value,10);});
  DV.o={};$$('input[data-o]',f).forEach(function(x){DV.o[x.dataset.o]=x.checked;});
  var pr=$('input[name="pay"]:checked',f);DV.o.comptant=!!(pr&&pr.value==='comptant');
}
function dvUpdate(){
  var f=$('#dvform');if(!f)return;dvRead();
  var c=calcDevis(DV.sel,DV.o),box=$('#dvsum');
  if(!c.rows.length){box.innerHTML='<p class="muted">Cochez un ou plusieurs projets.</p>';return;}
  var h=c.rows.map(function(p){return '<div class="l"><span>'+p.id+'. '+esc(p.name)+'</span><b>'+pTxt(p,p.price)+'</b></div>';}).join('');
  if(c.fo.length){
    h+='<div class="l"><span>Total au forfait</span><b>'+fmt(c.list)+' FCFA</b></div>';
    if(c.maj)h+='<div class="l"><span>Formule renforcée (+25 %)</span><b>+ '+fmt(c.maj)+' FCFA</b></div>';
    if(c.rate)h+='<div class="l"><span>Remises cumulées ('+c.rate+' %)</span><b>− '+fmt(c.rem)+' FCFA</b></div>';
    h+='<div class="l big"><span>Total</span><b>'+fmt(c.net)+' FCFA</b></div>';
    h+=payPlan(c.net,DV.o.comptant).map(function(x){return '<div class="l small"><span>'+x[0]+'</span><b>'+fmt(x[1])+'</b></div>';}).join('');
  }
  if(c.mo.length)h+='<div class="l"><span>Facturé chaque mois</span><b>'+fmt(c.monthTotal)+' FCFA / mois</b></div>';
  box.innerHTML=h;
}
function createDevis(p,ids,o,notes){
  var c=calcDevis(ids,o);
  if(!c.rows.length)return null;
  var y=new Date().getFullYear(),num='DEV-'+y+'-'+pad(S.settings.devisNum++,3);
  var d={num:num,date:today(),validUntil:addDays(today(),parseInt(S.settings.validite,10)||15),items:c.rows.map(function(r){return {id:r.id,name:r.name,price:r.price,monthly:r.monthly,dur:r.dur,suivi:r.suivi||0};}),o:JSON.parse(JSON.stringify(o)),calc:{list:c.list,maj:c.maj,rem:c.rem,rate:c.rate,net:c.net,monthTotal:c.monthTotal},notes:notes||'',statut:'brouillon'};
  (p.devis=p.devis||[]).push(d);
  if(!p.offreTestee)p.offreTestee=String(c.rows[0].id);
  addHist(p,'Devis '+num+' généré ('+fmt(c.net)+' FCFA)');
  return d;
}
function genDevis(p,notes){
  dvRead();
  var q=needQuote(DV.sel);if(q){toast('Le projet '+q.id+' est sur devis : saisissez d’abord son montant dans Paramètres > Prix des projets.');return;}
  var d=createDevis(p,DV.sel,DV.o,notes);
  if(!d){toast('Cochez au moins un projet.');return;}
  save();DV=null;
  openSheet(p.id,d.num);
}
/* ---------- commande reçue du site ---------- */
function parseOrder(t){
  t=String(t||'');
  function g(re){var m=t.match(re);return m?m[1].trim():'';}
  var o={nom:g(/^\s*Nom\s*:\s*(.+)$/mi),telephone:g(/^\s*T[ée]l[ée]phone\s*:\s*(.+)$/mi),email:g(/^\s*E-?mail\s*:\s*(.+)$/mi),entreprise:g(/^\s*Entreprise[^:\n]*:\s*(.+)$/mi)};
  var ids=[],re=/^\s*-\s*(\d{1,2})\.\s/mg,m;
  while((m=re.exec(t))){var n=parseInt(m[1],10);if(cat(n)&&ids.indexOf(n)<0)ids.push(n);}
  if(!ids.length){CATALOG.forEach(function(c){if(t.toLowerCase().indexOf(c.name.toLowerCase())>-1)ids.push(c.id);});}
  var pay=g(/^\s*Paiement\s*:\s*(.+)$/mi).toLowerCase(),rem=g(/^\s*Remises demand[ée]es\s*:\s*(.+)$/mi).toLowerCase();
  var opts={comptant:pay.indexOf('comptant')>-1,fidele:rem.indexOf('fid')>-1,jeune:rem.indexOf('jeune')>-1,asso:rem.indexOf('association')>-1,groupe:rem.indexOf('groupe')>-1,renf:/formule renforc[ée]e\s*:\s*oui/i.test(t)};
  var after=t.split(/Montant indicatif[^\n]*\n?/i)[1]||'';
  return {o:o,ids:ids,opts:opts,notes:after.trim()};
}
function orderModal(txt,msg){
  $('#modal').innerHTML='<div class="modal"><div class="box"><h2>Importer une commande du site</h2><p class="muted small">Sur le site, le client envoie sa commande par WhatsApp ou par e-mail. Copiez le message reçu, collez-le ci-dessous : la plateforme crée le prospect et prépare le devis.</p><div class="fld"><label for="ordtxt">Message de commande</label><textarea id="ordtxt" style="min-height:220px" placeholder="Bonjour GSC Business Center, Je souhaite commander. Nom : …">'+esc(txt||'')+'</textarea></div>'+(msg?'<p class="late">'+esc(msg)+'</p>':'')+'<div class="row"><button class="btn" data-act="order-go">Créer le prospect et le devis</button><button class="btn line" data-act="close-modal">Annuler</button></div></div></div>';
}
function applyOrder(r,canal){
  var ex=S.prospects.filter(function(p){var e=String(r.o.email||'').toLowerCase(),t=digits(r.o.telephone).slice(-8);return (e&&String(p.email||'').toLowerCase()===e)||(t.length>=8&&digits(p.telephone).slice(-8)===t);})[0],p=ex,d=null;
  var com=r.ids.length>0;
  if(!p){p=newProspect({nom:r.o.nom,entreprise:r.o.entreprise,telephone:r.o.telephone,email:r.o.email,canal:canal,offreTestee:com?String(r.ids[0]):'',statut:'Nouveau',description:r.notes,prochaineAction:com?'Confirmer la commande et envoyer le devis':'Répondre au message du site',dateProchaineAction:today()});}
  else{addHist(p,com?'Nouvelle commande reçue du site':'Nouveau message reçu du site');if(r.notes)p.notes=((p.notes?p.notes+'\n':'')+r.notes);p.prochaineAction=com?'Confirmer la commande et envoyer le devis':'Répondre au message du site';p.dateProchaineAction=today();}
  if(com&&!needQuote(r.ids))d=createDevis(p,r.ids,r.opts,'');
  return {p:p,d:d,ex:!!ex};
}
function importOrder(txt){
  var r=parseOrder(txt);
  if(!r.o.nom||r.o.nom.length<2){orderModal(txt,'Nom introuvable dans le message. Vérifiez que la ligne « Nom : … » est présente.');return;}
  if(!r.ids.length){orderModal(txt,'Aucun projet reconnu dans le message.');return;}
  var res=applyOrder(r,'Site web (commande)'),p=res.p,d=res.d;
  save();
  $('#modal').innerHTML='';
  toast(res.ex?'Commande ajoutée au prospect existant.':'Prospect et devis créés.');
  location.hash='#/p/'+p.id+'/devis';
  setTimeout(function(){if(d)openSheet(p.id,d.num);},60);
}

function openSheet(pid,num){

/* ---------- connexion automatique avec le site ---------- */
var syncing=false,syncTimer=null;
function syncOn(){return !!(S.settings.syncUrl&&S.settings.syncKey);}
function syncUrlFor(act,extra){
  var u=S.settings.syncUrl;
  return u+(u.indexOf('?')>-1?'&':'?')+'action='+act+'&key='+encodeURIComponent(S.settings.syncKey)+(extra||'');
}
function remoteToOrder(od){
  var x=od.data||{},rem=Array.isArray(x.remises)?x.remises:[];
  var ids=[];
  (Array.isArray(x.projects)?x.projects:[]).forEach(function(q){var n=parseInt(q&&q.n,10);if(cat(n)&&ids.indexOf(n)<0)ids.push(n);});
  var notes=String(x.message||'');
  if(x.type!=='commande'&&x.subject)notes=(x.subject+(notes?' : ':'')+notes);
  return {o:{nom:String(x.name||'').trim(),telephone:String(x.phone==null?'':x.phone).trim(),email:String(x.email||'').trim(),entreprise:String(x.company||'').trim()},ids:ids,opts:{comptant:String(x.paiement||'')==='comptant',fidele:rem.indexOf('fidele')>-1,jeune:rem.indexOf('jeune')>-1,asso:rem.indexOf('asso')>-1,groupe:rem.indexOf('groupe')>-1,renf:!!x.renf},notes:notes};
}
function syncMsg(m){var e=$('#syncmsg');if(e)e.textContent=m;}
function syncOrders(manual){
  if(!syncOn()){if(manual)toast('Renseignez d’abord la connexion dans Paramètres.');return Promise.resolve();}
  if(syncing)return Promise.resolve();
  syncing=true;
  if(manual)syncMsg('Synchronisation en cours…');
  return fetch(syncUrlFor('list')).then(function(r){return r.text();}).then(function(t){
    var j;try{j=JSON.parse(t);}catch(e){throw new Error('page');}
    if(j.status!=='ok')throw new Error(j.message||'service');
    var done=S.settings.syncDone||(S.settings.syncDone=[]),ids=[],n=0,last=null;
    (j.orders||[]).forEach(function(od){
      ids.push(od.id);
      if(done.indexOf(od.id)>-1)return;
      var r=remoteToOrder(od);
      if(r.o.nom.length<2)return;
      var res=applyOrder(r,r.ids.length?'Site web (commande)':'Site web (contact)');
      done.push(od.id);n++;last=res;
    });
    while(done.length>500)done.shift();
    S.settings.lastSync=new Date().toISOString();
    save();
    if(ids.length)fetch(syncUrlFor('ack','&ids='+encodeURIComponent(ids.join(',')))).catch(function(){});
    if(n){
      toast(n===1?'1 nouvelle demande reçue du site.':n+' nouvelles demandes reçues du site.');
      var rt=route();
      if(!$('#modal').innerHTML&&(rt.v==='dash'||rt.v==='prospects'||rt.v==='pipeline'))render();
    }else if(manual)toast('Aucune nouvelle commande.');
    syncMsg('Dernière synchronisation : '+new Date().toLocaleString('fr-FR')+(n?' · '+n+' reçue(s)':''));
  }).catch(function(e){
    var m=e&&e.message,txt;
    if(m==='page')txt='Le service répond avec une page Google au lieu des données. Vérifiez que l’accès du déploiement est réglé sur « Tout le monde ».';
    else if(m==='code incorrect')txt='Le code secret ne correspond pas à celui du script.';
    else if(m==='CODE_NON_MODIFIE')txt='Dans le script Google, le code est encore « CHANGEZ-MOI ». Remplacez-le par votre code, enregistrez, puis Déployer → Gérer les déploiements → crayon → Nouvelle version → Déployer.';
    else if(m==='CODE_TROP_COURT')txt='Le code du script Google est trop court : 8 caractères minimum. Modifiez-le, enregistrez, puis republiez une Nouvelle version.';
    else if(m&&m.indexOf('code secret non')>-1)txt='Le script publié sur Google est une ancienne version. Dans Apps Script : Déployer → Gérer les déploiements → crayon → Nouvelle version → Déployer. Vérifiez aussi que vous avez collé le dernier fichier GSC_Backend_Commandes.gs.';
    else if(m==='service'||(m&&m!=='Failed to fetch'&&m.indexOf('NetworkError')<0&&m.indexOf('Load failed')<0))txt='Le service a refusé la demande : '+m;
    else txt='Impossible de joindre le service (internet coupé ou adresse incorrecte).';
    syncMsg(txt);
    if(manual)toast(txt);
  }).then(function(){syncing=false;});
}
function syncStart(){
  syncOrders(false);
  if(!syncTimer)syncTimer=setInterval(function(){if(unlocked&&!document.hidden)syncOrders(false);},120000);
}

var GUIDES={"G": {"1": {"obj": "Comprendre le projet de la personne et sa situation (simple idée, activité déjà lancée sans papiers, ou création en cours), repérer les démarches et documents administratifs à réaliser, choisir le niveau de business plan (simplifié ou complet) et confirmer le périmètre avant d’établir un devis sur mesure.", "avant": ["Relire la fiche du prospect et son message de commande ou de contact.", "Envoyer la fiche de cadrage 48 h avant le rendez-vous (idée, forme juridique envisagée, documents déjà en main).", "Se remettre en tête les démarches de création et les pièces demandées selon la situation du porteur de projet.", "Avoir sous la main un exemple de synthèse d’une page, de business plan simplifié et de business plan complet avec dossier de financement.", "Vérifier la disponibilité du consultant sur la durée maximale du projet ({DUR}).", "Prévoir un endroit calme et 15 minutes de marge après l’entretien."], "temps": [[5, "Accueil et cadre", "Se présenter, expliquer le déroulé d’une heure, rappeler que le diagnostic est gratuit et confidentiel."], [15, "Le projet et sa situation", "Laisser la personne présenter son idée ou son activité, puis préciser où elle en est et ce qui a déjà été fait."], [10, "Démarches et documents administratifs", "Faire le point sur la forme juridique envisagée, les démarches déjà engagées et les documents disponibles."], [10, "Business plan : niveau et destinataire", "Savoir à qui le plan sera présenté et choisir entre business plan simplifié et complet."], [10, "Chiffres, financement et disponibilité", "Estimer le besoin de financement, l’apport, le temps disponible et le budget prévu."], [10, "Restitution et suite", "Résumer en 3 phrases, confirmer le périmètre (démarches, documents, business plan), annoncer le devis sous 48 h."]], "blocs": [{"t": "Projet et situation", "q": ["Racontez-moi votre projet en une seule phrase.", "Où en êtes-vous : simple idée, activité déjà commencée sans papiers, ou démarches déjà engagées ?", "Quel problème précis votre projet résout-il, et pour qui (qui est votre premier client) ?", "Avez-vous déjà parlé à de futurs clients ? Combien et qu’ont-ils dit ?", "Combien d’heures par semaine pouvez-vous consacrer à la mise en place ?", "Qui vous soutient aujourd’hui (famille, associé, mentor) ?"]}, {"t": "Démarches et documents administratifs", "q": ["Quelle forme juridique envisagez-vous, ou avez-vous besoin d’être conseillé(e) ?", "Quelles démarches avez-vous déjà faites (nom de l’activité, enregistrement, compte bancaire) ?", "Combien d’associés y a-t-il, et qui apporte quoi ?", "Avez-vous un local ou une adresse pour l’activité ?", "Quels documents avez-vous déjà (pièces d’identité, statuts, contrats, modèles de facture) ?", "Pour quelle date l’entreprise doit-elle être formalisée, et pourquoi cette date ?"]}, {"t": "Business plan et financement", "q": ["À qui voulez-vous présenter le business plan : une banque, un partenaire, un investisseur, ou pour vous-même ?", "Un document simple suffit-il, ou le financeur attend-il une étude détaillée avec marché, risques et scénarios chiffrés ?", "De quel montant avez-vous besoin pour démarrer, à peu près, et quel apport personnel pouvez-vous mettre ?", "Cherchez-vous un prêt, une subvention, un investisseur, ou aucun financement ?", "Avez-vous déjà estimé vos ventes et vos charges ?", "Êtes-vous prêt(e) à mener une courte enquête auprès de votre cible (pour un business plan complet) ?"]}, {"t": "Disponibilité et budget", "q": ["Pouvez-vous répondre à nos questions et fournir vos documents et chiffres pendant la durée du projet ({DUR} au maximum) ?", "Qui décide de la commande ?", "Ce projet est établi sur devis : quel budget avez-vous prévu pour la création et la formalisation ?", "Préférez-vous payer comptant ou en 3 tranches ?", "Quel résultat attendez-vous : entreprise formalisée, business plan simplifié, étude complète, plan de lancement ?"]}], "go": ["Porteur de projet ou entrepreneur qui veut créer ou formaliser son activité", "Sait à qui le business plan sera présenté (banque, partenaire ou pilotage du démarrage), ou n’en a pas besoin", "Peut fournir ses pièces, ses documents et ses chiffres dans les délais", "Disponible pendant toute la durée du projet ({DUR} au maximum)", "Budget compatible avec le devis présenté (paiement en 3 tranches possible)"], "stop": ["Entreprise déjà formalisée qui veut surtout des clients : orienter vers le projet 2 (Systèmes de vente et acquisition client) ou 6 (Coaching stratégique et croissance).", "Veut seulement un site ou des publications sur les réseaux : orienter vers le projet 4 (Création de sites web professionnels) ou 3 (Community management et marketing de contenu).", "Entreprise déjà structurée avec une équipe à organiser : orienter vers le projet 7 (Conseil et accompagnement à la performance des PME).", "Cherche un financement sans vouloir fournir ses chiffres ni travailler son projet : l’accompagnement ne convient pas."], "apres": ["Envoyer le devis dans les 48 h (onglet Devis), en précisant le périmètre : démarches, documents, niveau de business plan.", "Envoyer la fiche de cadrage et la liste des documents et chiffres à réunir.", "Relancer à J+5 si pas de réponse.", "Si accord : planifier la réunion de démarrage dans les 3 jours."]}, "2": {"obj": "Vérifier qu’il existe une offre claire qui se vend déjà (ou qui peut se tester), un minimum d’audience et la possibilité de payer en ligne, avant de construire le système de vente et d’acquisition client.", "avant": ["Regarder les pages, le site ou les réseaux du prospect avant l’appel.", "Repérer 2 ou 3 tunnels de concurrents à montrer comme exemples.", "Préparer un schéma simple : visiteur → page → commande → paiement → suivi.", "Vérifier quels moyens de paiement en ligne sont possibles (Wave, Orange Money, carte)."], "temps": [[5, "Accueil et cadre", "Présenter le déroulé et l’objectif : savoir si un tunnel est la bonne solution."], [15, "Offre et prix", "Faire décrire le produit ou service, son prix, sa marge et ses ventes actuelles."], [15, "Parcours client actuel", "Reconstituer le chemin du premier contact à l’achat et repérer où l’on perd des clients."], [10, "Audience et trafic", "Mesurer le nombre de contacts, les canaux et le budget publicitaire."], [5, "Paiement et technique", "Vérifier domaine, outils, paiement en ligne, contenus disponibles."], [10, "Restitution et suite", "Montrer les points faibles du parcours, confirmer ou non le tunnel, annoncer le devis."]], "blocs": [{"t": "Offre et prix", "q": ["Quel produit ou service voulez-vous vendre en ligne en priorité ?", "À quel prix, et quelle est votre marge ?", "Combien de ventes faites-vous par mois aujourd’hui, et à qui ?", "Quel résultat concret le client obtient-il après l’achat ?", "Avez-vous une offre complémentaire à proposer après la première vente ?", "Proposez-vous une garantie ou un essai ?"]}, {"t": "Parcours client actuel", "q": ["Comment vos clients vous trouvent-ils aujourd’hui ?", "Que se passe-t-il entre le premier contact et l’achat ?", "Sur 10 personnes qui vous contactent, combien achètent ?", "À quel moment perdez-vous le plus de clients ?", "Comment suivez-vous vos prospects (cahier, WhatsApp, tableau) ?", "Qui répond aux messages et en combien de temps ?"]}, {"t": "Audience et trafic", "q": ["Combien de personnes pouvez-vous toucher (abonnés, contacts WhatsApp, liste e-mail) ?", "Faites-vous déjà de la publicité ? Quel budget par mois ?", "Quels contenus ou messages ont déjà bien marché ?", "Avez-vous une liste de clients à qui vendre à nouveau ?"]}, {"t": "Paiement et technique", "q": ["Comment vos clients paient-ils aujourd’hui ?", "Avez-vous un nom de domaine, un site ou une page professionnelle ?", "Avez-vous des photos, vidéos et témoignages utilisables ?", "Qui gérera le tunnel et répondra aux commandes après la mise en ligne ?", "Quelles contraintes de livraison ou de service après-vente avez-vous ?"]}], "go": ["Une offre claire avec un prix défini", "Au moins quelques ventes déjà réalisées (ou un test possible)", "Une audience existante ou un budget pour attirer du trafic", "Paiement en ligne possible (mobile money ou carte)", "Une personne disponible pour répondre aux commandes"], "stop": ["Aucune offre définie : commencer par le projet 1 (Création et formalisation d’entreprise).", "Ni audience ni budget : commencer par le projet 3 (Community management et marketing de contenu).", "Veut seulement se présenter en ligne : orienter vers le projet 4 (Création de sites web professionnels)."], "apres": ["Envoyer le devis sous 48 h.", "Préparer la carte du parcours client (une page) à présenter avec le devis.", "Lister les accès à demander : domaine, pages, outils de paiement.", "Relancer à J+5."]}, "3": {"obj": "Comprendre la présence actuelle sur les réseaux, les objectifs, la cible et les ressources de contenu, et confirmer que le client peut valider les publications vite et s’engager chaque mois.", "avant": ["Regarder les pages Facebook, Instagram, TikTok, LinkedIn du prospect.", "Noter fréquence, qualité des visuels, interactions, ton.", "Repérer 2 concurrents bien animés pour comparer.", "Préparer un exemple de calendrier éditorial sur une semaine."], "temps": [[5, "Accueil et cadre", "Expliquer que le service est facturé chaque mois et le déroulé de l’entretien."], [15, "Présence actuelle", "Passer chaque réseau en revue : audience, fréquence, résultats, qui publie."], [15, "Objectifs et cible", "Définir ce que les réseaux doivent apporter et à qui ils parlent."], [10, "Contenu et validation", "Voir ce qu’on peut filmer, photographier, et comment se fait la validation."], [5, "Publicité et budget", "Parler du budget publicitaire séparé et des indicateurs suivis."], [10, "Restitution et suite", "Présenter les 3 priorités, confirmer l’engagement mensuel, annoncer le devis."]], "blocs": [{"t": "Présence actuelle", "q": ["Sur quels réseaux êtes-vous présent(e) et depuis quand ?", "Combien d’abonnés avez-vous sur chacun ?", "À quelle fréquence publiez-vous ?", "Quelles publications ont le mieux marché, et pourquoi à votre avis ?", "Qui s’occupe des réseaux aujourd’hui ?", "Avez-vous déjà eu un community manager ? Qu’est-ce qui n’a pas marché ?"]}, {"t": "Objectifs et cible", "q": ["Que voulez-vous obtenir des réseaux : être connu, vendre, recruter, fidéliser ?", "Qui sont vos clients idéaux (âge, ville, métier) ?", "Sur quels réseaux se trouvent-ils vraiment ?", "Comment décririez-vous le ton de votre marque (sérieux, proche, humoristique) ?", "Quelles marques ou concurrents admirez-vous sur les réseaux ?", "Quel chiffre vous ferait dire que c’est un succès dans 3 mois ?"]}, {"t": "Contenu et validation", "q": ["Pouvez-vous fournir des photos et vidéos de vos produits ou de votre travail ?", "Acceptez-vous d’apparaître en vidéo ?", "Qui valide les publications, et sous combien de temps ?", "Qui répond aux messages et commentaires, aux heures d’ouverture ?", "Y a-t-il des sujets ou des mots à éviter ?"]}, {"t": "Publicité et budget", "q": ["Avez-vous déjà fait de la publicité payante ? Avec quel résultat ?", "Quel budget publicitaire mensuel pouvez-vous prévoir en plus du service ?", "Pouvez-vous vous engager sur plusieurs mois ? Combien ?", "Quels rapports voulez-vous recevoir et à quel rythme ?"]}], "go": ["Au moins un réseau où se trouve réellement la cible", "Une personne qui valide les publications sous 48 h", "Des contenus disponibles ou un accès au terrain pour en produire", "Budget mensuel de 100 000 FCFA confirmé, plus un budget publicitaire si besoin", "Objectifs mesurables et réalistes"], "stop": ["Pas d’offre claire à promouvoir : commencer par le projet 1 (Création et formalisation d’entreprise).", "Attend des ventes automatiques sans contenu : orienter vers le projet 2 (Systèmes de vente et acquisition client).", "Attend des résultats en deux semaines : réajuster les attentes avant tout devis."], "apres": ["Envoyer le devis (rappeler que le tarif est mensuel).", "Préparer une proposition de calendrier éditorial pour la 1re semaine.", "Demander les accès aux pages et les éléments de marque.", "Relancer à J+5."]}, "4": {"obj": "Comprendre à quoi doit servir le site, ce que le visiteur doit y faire, et vérifier que le client peut fournir contenus et décisions dans les délais.", "avant": ["Regarder le site actuel s’il existe, ou la page Facebook.", "Chercher 3 sites de concurrents et noter leurs points forts.", "Vérifier si le nom de domaine souhaité est libre.", "Préparer l’exemple d’arborescence d’un site de 5 pages."], "temps": [[5, "Accueil et cadre", "Présenter le déroulé et ce que l’entretien permettra de décider."], [15, "Objectif du site", "Savoir pourquoi, pour qui et pour faire quoi."], [15, "Contenu et identité visuelle", "Faire l’inventaire des logos, textes, photos, témoignages."], [10, "Technique et suite", "Domaine, hébergement, mises à jour, référencement."], [5, "Délais et décision", "Date souhaitée, décideur, disponibilité pour valider."], [10, "Restitution et suite", "Proposer l’arborescence, confirmer le périmètre, annoncer le devis."]], "blocs": [{"t": "Objectif du site", "q": ["Pourquoi voulez-vous un site internet ?", "Qui sont les visiteurs que vous voulez attirer ?", "Que doit faire un visiteur sur le site : appeler, écrire, réserver, commander ?", "Avez-vous déjà un site ? Qu’est-ce qui ne va pas ?", "Quels sites aimez-vous, et pourquoi ?", "Quelles fonctions voulez-vous : formulaire, blog, réservation, boutique, plusieurs langues ?"]}, {"t": "Contenu et identité visuelle", "q": ["Avez-vous un logo, des couleurs et une charte graphique ?", "Les textes de présentation sont-ils prêts, ou faut-il les écrire ?", "Avez-vous de bonnes photos de vos produits, locaux, équipe ?", "Avez-vous des témoignages ou des références clients ?", "Avez-vous les mentions légales (nom, adresse, numéro d’enregistrement) ?"]}, {"t": "Technique et suite", "q": ["Avez-vous déjà acheté un nom de domaine ? Chez qui ?", "Avez-vous une adresse e-mail professionnelle ?", "Qui mettra le site à jour après la livraison ?", "Voulez-vous apparaître sur Google pour votre ville ou votre zone ?", "Acceptez-vous les frais annuels de domaine et d’hébergement ?"]}, {"t": "Délais et décision", "q": ["Pour quelle date voulez-vous que le site soit en ligne, et pourquoi cette date ?", "Qui décide et valide les maquettes ?", "Pouvez-vous répondre sous 48 h pendant le projet ?", "Quel budget avez-vous prévu pour le site ?"]}], "go": ["Activité existante ou clairement définie", "Contenus disponibles ou capacité à les fournir rapidement", "Un seul décideur disponible pour valider", "Délai réaliste (environ {DUR})", "Budget compatible avec 150 000 FCFA"], "stop": ["Veut une boutique en ligne complexe ou une application mobile : étudier un devis spécifique.", "Aucune offre définie : commencer par le projet 1 (Création et formalisation d’entreprise).", "Veut surtout du trafic et des ventes : projet 2 (Systèmes de vente) ou 3 (Community management)."], "apres": ["Envoyer le devis sous 48 h avec la liste des pages prévues.", "Envoyer la liste des éléments à préparer (logo, textes, photos).", "Vérifier la disponibilité du nom de domaine.", "Relancer à J+5."]}, "5": {"obj": "Comprendre le rôle du dirigeant, ses situations difficiles avec l’équipe, et mesurer sa volonté réelle de changer sa façon de diriger. Le parcours peut intégrer le diagnostic organisationnel et les priorités de structuration d’une PME.", "avant": ["Relire la fiche et noter la taille de l’équipe.", "Préparer 3 situations de leadership à faire raconter (conflit, délégation, décision).", "Préparer le modèle d’évaluation du style de leadership.", "Prévoir un entretien sans interruption."], "temps": [[5, "Accueil et cadre", "Poser la confidentialité : le dirigeant va parler de ses difficultés."], [10, "Rôle et contexte", "Poste, ancienneté, taille et structure de l’équipe."], [20, "Défis de leadership", "Faire raconter 2 ou 3 situations récentes difficiles."], [10, "Équipe et communication", "Réunions, retours, objectifs partagés, absences, départs."], [5, "Engagement personnel", "Temps disponible, ouverture aux retours, objectif à 5 mois."], [10, "Restitution et suite", "Nommer les 2 axes de progression, annoncer le devis."]], "blocs": [{"t": "Rôle et contexte", "q": ["Quel est votre rôle exact et depuis quand le tenez-vous ?", "Combien de personnes dirigez-vous, et à quel niveau ?", "Comment êtes-vous devenu(e) responsable ?", "Qu’est-ce qui marche bien dans votre équipe ?", "Quel est le plus grand défi de l’entreprise en ce moment ?"]}, {"t": "Défis de leadership", "q": ["Racontez une situation récente où vous avez perdu patience ou été en difficulté avec l’équipe.", "Avez-vous du mal à déléguer ? Qu’est-ce que vous gardez pour vous ?", "Comment gérez-vous un conflit entre deux personnes ?", "Quelle décision difficile avez-vous repoussée ?", "Comment gérez-vous le stress et la fatigue ?", "Comment votre équipe vous décrirait-elle en trois mots ?"]}, {"t": "Équipe et communication", "q": ["À quelle fréquence réunissez-vous l’équipe, et pour quoi faire ?", "Chacun connaît-il ses objectifs ?", "Comment donnez-vous des retours, positifs et négatifs ?", "Y a-t-il eu des départs ou des absences répétées récemment ?", "Avez-vous des responsables intermédiaires ?"]}, {"t": "Engagement personnel", "q": ["Combien d’heures par semaine pouvez-vous consacrer au coaching ?", "Êtes-vous prêt(e) à recueillir l’avis de votre équipe sur votre façon de diriger ?", "Quel changement précis voulez-vous voir dans 5 mois ?", "Qu’avez-vous déjà essayé pour progresser (formation, lecture, mentor) ?", "Quelqu’un d’autre (associé, conjoint) est-il concerné par ce changement ?"]}], "go": ["Dirige déjà une équipe, ou va en recruter bientôt", "Une difficulté de leadership nette et identifiée", "Disponible pour des séances régulières", "Ouvert(e) aux retours de son équipe", "Objectif de changement précis et réaliste"], "stop": ["Le vrai problème est le chiffre d’affaires ou la trésorerie : orienter vers le projet 6 (Coaching stratégique et croissance) ou 7 (Performance des PME).", "Travaille seul(e), sans projet d’équipe : projet 1 (Création et formalisation d’entreprise).", "Conflit juridique ou social grave : hors périmètre, conseiller un avocat."], "apres": ["Envoyer le devis sous 48 h.", "Envoyer le questionnaire d’évaluation du style de leadership.", "Proposer un créneau de séance hebdomadaire fixe.", "Relancer à J+5."]}, "6": {"obj": "Mesurer les chiffres de l’entreprise, trouver ce qui bloque la croissance et vérifier que le dirigeant a des clients réguliers, des données et du temps pour une séance stratégique chaque semaine. Le projet intègre aussi les besoins de performance et d’organisation de l’entreprise.", "avant": ["Demander (si possible) le chiffre d’affaires des 6 derniers mois.", "Regarder l’offre, les prix et la présence en ligne du prospect.", "Préparer un schéma d’entonnoir : contacts, devis, ventes.", "Préparer la grille d’audit ventes et marketing."], "temps": [[5, "Accueil et cadre", "Expliquer qu’on va parler chiffres, en toute confidentialité."], [15, "Chiffres clés", "Chiffre d’affaires, marge, clients, panier moyen, trésorerie."], [15, "Ventes et marketing", "D’où viennent les clients, combien de prospects, quel taux de conversion."], [10, "Blocages et ambition", "Ce qui freine la croissance et l’objectif des 12 prochains mois."], [5, "Organisation et engagement", "Qui fait quoi, temps du dirigeant, séance hebdomadaire."], [10, "Restitution et suite", "Nommer le goulot principal, confirmer le projet, annoncer le devis."]], "blocs": [{"t": "Chiffres clés", "q": ["Quel est votre chiffre d’affaires mensuel moyen sur les 6 derniers mois ?", "Quels ont été le meilleur et le pire mois ?", "Quelle est votre marge à peu près ?", "Combien de clients actifs avez-vous, et quel est le panier moyen ?", "Quelle part de vos clients revient acheter ?", "Votre trésorerie est function parseCSV(t){
  t=String(t).replace(/^﻿/,'');
  var first=t.split(/\r?\n/)[0]||'',del=(first.split(';').length>=first.split(',').length)?';':',';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===del){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[];}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}

}

function formVals(f){var o={};$$('input,select,textarea',f).forEach(function(e){if(e.name&&e.type!=='radio')o[e.name]=e.value;});return o;}
document.addEventListener('click',function(e){
  var go=e.target.closest('[data-go]');
  if(go&&!e.target.closest('a,button')){location.hash=go.dataset.go;return;}
  var cp=e.target.closest('[data-copy]');
  if(cp){copyText(cp.dataset.copy,cp);return;}
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id,p;
  if(a==='import-csv'){$('#fcsv').click();}
  else if(a==='export-csv'){exportCSV();}
  else if(a==='mv'){p=getP(id);var i=stIdx(p.statut)+parseInt(el.dataset.d,10);if(i>=0&&i<STATUTS.length){setStatut(p,STATUTS[i]);save();render();}}
  else if(a==='del-p'){if(confirm('Supprimer ce prospect et ses devis ?')){S.prospects=S.prospects.filter(function(x){return x.id!==id;});save();location.hash='#/prospects';}}
  else if(a==='dv-view'){var q=getP(route().id);openSheet(q.id,el.dataset.num);}
  else if(a==='dv-del'){if(confirm('Supprimer ce devis ?')){var q2=getP(route().id);q2.devis=q2.devis.filter(function(d){return d.num!==el.dataset.num;});addHist(q2,'Devis '+el.dataset.num+' supprimé');save();render();}}
  else if(a==='dv-print'){window.print();}
  else if(a==='dv-sent'){markSent(el.dataset.pid,el.dataset.num);toast('Devis marqué comme envoyé. Relance prévue dans 5 jours.');}
  else if(a==='close-modal'){$('#modal').innerHTML='';render();}
  else if(a==='exp-json'){download('sauvegarde-plateforme-gsc-'+today()+'.json',JSON.stringify(S),'application/json');}
  else if(a==='imp-json'){$('#fjson').click();}
  else if(a==='demo'){demo();}
  else if(a==='imp-order'){orderModal('');}
  else if(a==='order-go'){importOrder($('#ordtxt').value);}
  else if(a==='meta-now'){var mf=el.closest('form');if(mf&&mf.dataset.form==='meta'){var mv=formVals(mf);S.settings.metaUrl=(mv.metaUrl||'').trim();S.settings.metaKey=(mv.metaKey||'').trim();save();}syncMeta(true);}
  else if(a==='sync-now'){var sf=el.closest('form');if(sf&&sf.dataset.form==='sync'){var sv=formVals(sf);S.settings.syncUrl=(sv.syncUrl||'').trim();S.settings.syncKey=(sv.syncKey||'').trim();save();}syncOrders(true);}
  else if(a.indexOf('entr-')===0){entrAct(a,el);}
  else if(a.indexOf('rp-')===0){rapportAct(a,el);}
  else if(a.indexOf('fac-')===0){facAct(a,el);}
  else if(a==='guide-print'){entrSheet(null,parseInt(el.dataset.id,10));}
  else if(a==='lock'){lockNow();}
  else if(a==='pin-off'){
    var cur=prompt('Entrez le code actuel pour retirer la protection :');
    if(cur!==null)pinCheck(cur).then(function(ok){if(ok){localStorage.removeItem(KEYPIN);toast('Code retiré.');render();}else toast('Code incorrect.');});
  }
  else if(a==='reset'){if(confirm('Tout effacer : prospects, devis et réglages ?')&&confirm('Dernière confirmation : cette action est définitive. Avez-vous exporté une sauvegarde ?')){S=defaults();save();render();toast('Données effacées.');}}
  else if(a==='restore-bak'){
    var b=[];try{b=JSON.parse(localStorage.getItem(KEYB)||'[]');}catch(x){}
    $('#modal').innerHTML='<div class="modal"><div class="box"><h2>Copies automatiques</h2>'+(b.length?b.slice().reverse().map(function(s,k){var i=b.length-1-k,n=0;try{n=JSON.parse(s.data).prospects.length;}catch(x){}return '<div class="row card"><span>'+new Date(s.d).toLocaleString('fr-FR')+' · '+n+' prospects</span><button class="btn sm" data-act="do-restore" data-i="'+i+'">Restaurer</button></div>';}).join(''):'<p class="muted">Aucune copie pour le moment.</p>')+'<button class="btn line" data-act="close-modal">Fermer</button></div></div>';
  }
  else if(a==='do-restore'){var bb=JSON.parse(localStorage.getItem(KEYB)||'[]'),it=bb[parseInt(el.dataset.i,10)];if(it&&confirm('Remplacer les données actuelles par cette copie ?')){S=JSON.parse(it.data);save();$('#modal').innerHTML='';render();toast('Copie restaurée.');}}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  var t=f.dataset.form,p;
  if(t==='prospect'){
    var v=formVals(f);
    if((v.nom||'').trim().length<2){$('#fmsg').textContent='Indiquez le nom du prospect.';$('#f-nom').focus();return;}
    if(v.email&&!validEmail(v.email)){$('#fmsg').textContent='Adresse e-mail invalide.';$('#f-email').focus();return;}
    if(f.dataset.id){
      p=getP(f.dataset.id);var oldSt=p.statut;
      COLS.forEach(function(k){if(k!=='id'&&k!=='dateSubmission'&&v[k]!==undefined)p[k]=v[k].trim();});
      if(p.statut!==oldSt){var ns=p.statut;p.statut=oldSt;setStatut(p,ns);}
      p.dateDerniereAction=today();addHist(p,'Fiche modifiée');save();toast('Prospect enregistré.');render();
    }else{
      if(isDup(v)&&!confirm('Un prospect avec le même e-mail ou téléphone existe déjà. L’ajouter quand même ?'))return;
      var o={};COLS.forEach(function(k){if(k!=='id'&&v[k]!==undefined)o[k]=v[k].trim();});
      if(!o.prochaineAction){o.prochaineAction='Planifier le diagnostic gratuit';o.dateProchaineAction=addDays(today(),2);}
      p=newProspect(o);save();toast('Prospect ajouté.');location.hash='#/p/'+p.id;
    }
  }else if(t==='diag'){
    p=getP(f.dataset.id);var dg=readDiag(f);
    if(!diagScore(dg)){toast('Évaluez au moins un besoin.');return;}
    p.diag=dg;if(dg.stade)p.stade=dg.stade;
    if(stIdx(p.statut)<2){setStatut(p,'Diagnostic réalisé');}
    p.prochaineAction='Envoyer le devis (sous 48 h)';p.dateProchaineAction=addDays(today(),2);
    var sc=diagScore(dg);addHist(p,'Diagnostic réalisé : maturité '+sc.score+'/100 ('+sc.label+')');
    save();DV=null;toast('Diagnostic enregistré.');render();
  }else if(t==='dv'){
    p=getP(route().id);genDevis(p,(f.elements.notes.value||'').trim());
  }else if(t==='params'){
    var q=formVals(f),s=S.settings;
    s.consultants=q.consultants.split(',').map(function(x){return x.trim();}).filter(Boolean);if(!s.consultants.length)s.consultants=['Consultant'];
    ['phone','whatsapp','email','rdv','website','legal'].forEach(function(k){s[k]=q[k].trim();});
    s.whatsapp=digits(s.whatsapp);s.validite=parseInt(q.validite,10)||15;save();toast('Paramètres enregistrés.');
  }else if(t==='catalog'){
    var c=formVals(f);S.settings.catalog=CATALOG.map(function(x){var n=parseInt(c['c'+x.id],10),d=parseInt(c['d'+x.id],10),m=parseInt(c['s'+x.id],10);return {id:x.id,price:isNaN(n)||n<0?x.price:n,days:isNaN(d)||d<1?x.days:d,suivi:isNaN(m)||m<0?0:Math.min(m,36)};});save();toast('Prix, durées et suivis enregistrés.');render();
  }else if(t==='pin'){
    var pv=formVals(f),msg=$('#pinmsg');
    if((pv.pin1||'').length<4){msg.textContent='Le code doit contenir au moins 4 caractères.';return;}
    if(pv.pin1!==pv.pin2){msg.textContent='Les deux codes ne sont pas identiques.';return;}
    var setIt=function(){hashPin(pv.pin1).then(function(h){localStorage.setItem(KEYPIN,h);try{sessionStorage.setItem('gscPlatOk','1');}catch(x){}toast('Code enregistré.');render();});};
    if(pinSet())pinCheck(pv.cur||'').then(function(ok){if(ok)setIt();else msg.textContent='Code actuel incorrect.';});else setIt();
  }else if(t==='meta'){
    var my=formVals(f),mu=(my.metaUrl||'').trim();
    if(mu&&mu.indexOf('https://')!==0){metaMsg('L’adresse doit commencer par https://');return;}
    S.settings.metaUrl=mu;S.settings.metaKey=(my.metaKey||'').trim();save();toast('Connexion Meta enregistrée.');render();if(metaOn())metaStart();
  }else if(t==='sync'){
    var sy=formVals(f),su=(sy.syncUrl||'').trim();
    if(su&&su.indexOf('https://')!==0){syncMsg('L’adresse doit commencer par https://');return;}
    S.settings.syncUrl=su;S.settings.syncKey=(sy.syncKey||'').trim();save();toast('Connexion enregistrée.');render();if(syncOn())syncStart();
  }else if(t==='fact'){
    var fv=formVals(f),fs=S.settings;
    ['raison','adresse','ninea','rccm','payInfo','tvaOn','tvaMode'].forEach(function(k){fs[k]=(fv[k]||'').trim();});
    fs.tvaRate=Math.max(0,parseFloat(fv.tvaRate))||0;fs.facNum=Math.max(1,parseInt(fv.facNum,10)||1);
    save();toast('Facturation enregistrée.');render();
  }else if(t==='rapport'){
    rpSave(f);toast('Rapport enregistré.');render();
  }else if(t==='entr'){
    entrSave(f);
  }else if(t==='tpl'){
    var m=formVals(f);S.settings.tpl.forEach(function(x){if(m[x.id]!==undefined)x.m=m[x.id];});save();toast('Modèles enregistrés.');
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.filt==='q'){filt.q=el.value;refreshList();}
});
document.addEventListener('change',function(e){
  var el=e.target,f;
  if(el.dataset&&el.dataset.filt){filt[el.dataset.filt]=el.value;refreshList();return;}
  if(el.id==='fcsv'&&el.files[0]){var r=new FileReader();r.onload=function(){importCSV(r.result);};r.readAsText(el.files[0],'utf-8');el.value='';return;}
  if(el.id==='fjson'&&el.files[0]){var r2=new FileReader();r2.onload=function(){try{var o=JSON.parse(r2.result);if(!o.prospects||!o.settings)throw 0;if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){S=o;S.settings=Object.assign(defaults().settings,S.settings);save();render();toast('Sauvegarde restaurée.');}}catch(x){toast('Fichier de sauvegarde invalide.');}};r2.readAsText(el.files[0]);el.value='';return;}
  if(el.dataset&&el.dataset.fpay){facPay(el);return;}
  if(el.hasAttribute&&el.hasAttribute('data-msgp')){msgP=el.value;render();return;}
  if(el.hasAttribute&&el.hasAttribute('data-entrp')){entrP[route().id]=parseInt(el.value,10);render();return;}
  if(el.dataset&&el.dataset.dvst){
    var p=getP(route().id),d=p.devis.filter(function(x){return x.num===el.dataset.dvst;})[0],ns=el.value;
    d.statut=ns;
    if(ns==='envoyé'){setStatut(p,'Devis envoyé');p.prochaineAction='Relancer le devis '+d.num;p.dateProchaineAction=addDays(today(),5);}
    else if(ns==='accepté'){setStatut(p,'Signé / Client','devis '+d.num);p.prochaineAction='Réunion de démarrage';p.dateProchaineAction=addDays(today(),3);}
    else if(ns==='refusé'){setStatut(p,'Perdu','devis '+d.num+' refusé');p.prochaineAction='';p.dateProchaineAction='';}
    addHist(p,'Devis '+d.num+' : '+ns);
    var nf=ns==='accepté'?autoFacture(p,d):null;
    save();render();if(nf){toast('Devis accepté : facture '+nf.num+' générée.');location.hash='#/p/'+p.id+'/fact';}return;
  }
  f=el.closest&&el.closest('form[data-form]');
  if(f&&f.dataset.form==='diag'){$('#dgres').innerHTML=diagResult(readDiag(f));}
  if(f&&f.dataset.form==='dv'){dvUpdate();}
  if(f&&f.dataset.form==='entr'){entrSave(f,true);}
  if(f&&f.dataset.form==='rapport'){rpSave(f);}
});
document.addEventListener('dragstart',function(e){var k=e.target.closest&&e.target.closest('.kc');if(k){e.dataTransfer.setData('text/plain',k.dataset.id);e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',function(e){var c=e.target.closest&&e.target.closest('.col');if(c){e.preventDefault();c.classList.add('over');}});
document.addEventListener('dragleave',function(e){var c=e.target.closest&&e.target.closest('.col');if(c)c.classList.remove('over');});
document.addEventListener('drop',function(e){
  var c=e.target.closest&&e.target.closest('.col');if(!c)return;
  e.preventDefault();var p=getP(e.dataTransfer.getData('text/plain'));
  if(p&&c.dataset.col!==p.statut){setStatut(p,c.dataset.col);save();render();}
});
window.addEventListener('hashchange',function(){if(unlocked)render();});
['click','keydown','input'].forEach(function(ev){document.addEventListener(ev,function(){idleAt=Date.now();},true);});
setInterval(function(){if(unlocked&&pinSet()&&Date.now()-idleAt>900000)lockNow();},30000);
start();
})();
/* =====================================================================
   GSC – Suggestions de remarques pour l'onglet Diagnostic
   À coller avant </body> dans 02_Plateforme_Prospection_Diagnostic.html
   Principe : sous chaque champ « Remarque (facultatif) », des puces
   cliquables apparaissent selon le besoin ET le niveau coché.
   Un clic ajoute la phrase dans le champ (plusieurs clics = cumul).
   ===================================================================== */

const REMARQUES_GSC = {
  "Stratégie et plan": {
    Manquant: [
      "Aucun plan écrit ni objectif chiffré à 6 mois → Création et formalisation d'entreprise",
      "Cible et offre de valeur non définies ; vend à tout le monde → Coaching stratégique et croissance",
      "Pas de vision claire de l'entreprise à 1 an / 3 ans",
      "Activité lancée sans étude de marché ni test de l'offre"
    ],
    Partiel: [
      "Idée claire mais pas de business plan ni de prévisions chiffrées",
      "Objectifs définis à l'oral, jamais suivis ni mesurés",
      "Positionnement flou face à la concurrence"
    ],
    Acquis: [
      "Business plan rédigé, cible et offre bien définies",
      "Objectifs annuels fixés et suivis régulièrement"
    ]
  },
  "Vente et marketing": {
    Manquant: [
      "Clients uniquement par bouche-à-oreille, aucun canal d'acquisition → Systèmes de vente et acquisition client",
      "Aucune présence en ligne (page, WhatsApp Business, site)",
      "Pas d'offre ni de prix clairement présentés aux prospects",
      "Ne suit pas ses prospects : pas de relance ni de liste de contacts"
    ],
    Partiel: [
      "Page Facebook ou WhatsApp Business active mais publications irrégulières → Community management",
      "Vend régulièrement mais sans processus de vente structuré",
      "Fait de la publicité de temps en temps sans mesurer les résultats"
    ],
    Acquis: [
      "Canal d'acquisition identifié et clientèle régulière",
      "Contenu publié régulièrement, prospects suivis et relancés"
    ]
  },
  "Outils digitaux": {
    Manquant: [
      "Aucun outil numérique : pas d'email pro, de logo ni de facturation → Création de sites web professionnels",
      "Pas de site web ni de vitrine en ligne pour présenter l'activité",
      "Tout se fait sur papier ou de mémoire",
      "Veut digitaliser mais ne sait pas par où commencer → Conseil en transformation digitale"
    ],
    Partiel: [
      "Utilise WhatsApp et Excel, mais sans outil structuré ni sauvegarde",
      "Site existant mais peu visible ou non à jour",
      "Plusieurs outils non connectés entre eux, double saisie"
    ],
    Acquis: [
      "Site, email professionnel et outils de gestion en place",
      "Processus digitalisés et équipe formée aux outils"
    ]
  },
  "Gestion et organisation": {
    Manquant: [
      "Pas de NINEA ni de RCCM ; activité informelle → Création et formalisation d'entreprise",
      "Aucun suivi des ventes, des dépenses ni de la trésorerie",
      "Pas de facturation ni de devis ; paiements non tracés",
      "Pas de stock ni de procédures : tout repose sur le dirigeant"
    ],
    Partiel: [
      "NINEA obtenu, RCCM ou régime fiscal en attente",
      "Cahier de caisse tenu de façon irrégulière",
      "Gestion au jour le jour, sans tableau de bord → Conseil et accompagnement à la performance des PME"
    ],
    Acquis: [
      "Entreprise immatriculée, comptabilité de base tenue",
      "Indicateurs suivis chaque mois (ventes, marge, trésorerie)"
    ]
  },
  "Équipe et leadership": {
    Manquant: [
      "Porteur seul, aucune délégation, surcharge de travail → Coaching en leadership et management",
      "Rôles et responsabilités non définis",
      "Pas de contrat ni de règles internes avec les collaborateurs"
    ],
    Partiel: [
      "Un associé ou employé, mais répartition des tâches floue",
      "Réunions d'équipe rares, communication interne à améliorer",
      "Dirigeant très impliqué dans l'opérationnel, peu de temps pour piloter"
    ],
    Acquis: [
      "Équipe structurée, rôles et contrats clairs",
      "Dirigeant délègue et pilote avec des objectifs d'équipe"
    ]
  },
  "Financement": {
    Manquant: [
      "Pas de compte bancaire pro ; argent personnel et de l'entreprise mélangés",
      "Aucun apport ni source de financement identifiée",
      "Besoin de financement non chiffré → Business Accelerator Premium",
      "Ne connaît pas les dispositifs d'appui (DER/FJ, banques, microfinance)"
    ],
    Partiel: [
      "Apport personnel disponible mais pas de plan de financement",
      "Démarches de financement commencées, dossier incomplet",
      "Trésorerie tendue : retards de paiement clients ou fournisseurs"
    ],
    Acquis: [
      "Capital réuni, compte professionnel ouvert",
      "Dossier de financement prêt ou financement déjà obtenu"
    ]
  }
};

/* --- Intégration : puces cliquables sous chaque champ « Remarque » --- */
(function () {
  var LV = ["Manquant", "Partiel", "Acquis"];
  var BTN = "font:inherit;font-size:12px;font-weight:500;padding:4px 10px;border:1px solid var(--line,#d9d4ee);border-radius:999px;background:#faf9ff;cursor:pointer;color:inherit";

  function maj(need) {
    var b = need.querySelector("b"), input = need.querySelector('input[name^="c_"]');
    if (!b || !input) return;
    var besoin = b.textContent.trim();
    var data = REMARQUES_GSC[besoin];
    if (!data) return;
    var r = need.querySelector('input[type="radio"]:checked');
    var key = r ? r.value : "";
    var zone = need.querySelector(".gsc-chips");
    if (zone && zone.getAttribute("data-lv") === key) return;   // rien à changer
    if (!zone) {
      zone = document.createElement("div");
      zone.className = "gsc-chips";
      zone.style.cssText = "grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px";
      need.appendChild(zone);
    }
    zone.setAttribute("data-lv", key);
    zone.innerHTML = "";
    if (key === "") return;                                     // aucun niveau choisi
    (data[LV[parseInt(key, 10)]] || []).forEach(function (txt) {
      var court = txt.split(" \u2192 ")[0];
      var c = document.createElement("button");
      c.type = "button";
      c.textContent = court;
      c.title = txt;
      c.style.cssText = BTN;
      c.addEventListener("click", function () {
        var v = input.value.trim();
        if (v.indexOf(court) !== -1) return;                    // évite les doublons
        input.value = v ? v.replace(/[;.\s]+$/, "") + " ; " + court : court;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      });
      zone.appendChild(c);
    });
  }

  function init() {
    var needs = document.querySelectorAll("form[data-form='diag'] .need");
    for (var i = 0; i < needs.length; i++) maj(needs[i]);
  }

  document.addEventListener("change", function (e) {
    if (e.target && e.target.name && e.target.name.indexOf("n_") === 0) init();
  });
  var t;
  new MutationObserver(function () { clearTimeout(t); t = setTimeout(init, 30); })
    .observe(document.body, { childList: true, subtree: true });
  init();
})();
